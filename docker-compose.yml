services:
  therefore-auth-provider:
    build:
      context: ./services/auth-provider
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth-provider/tenants.json:/app/tenants.json:ro
    restart: unless-stopped
    profiles:
      - auth
      - http

  therefore-mcp:
    build: .
    env_file:
      - .env.local
    volumes:
      - cache:/app/cache
    stdin_open: true
    profiles:
      - stdio

  therefore-mcp-http:
    build: .
    env_file:
      - .env.local
    volumes:
      - cache:/app/cache
    ports:
      - "8000:8000"
    command: ["--http", "8000"]
    restart: unless-stopped
    profiles:
      - http

volumes:
  cache:
